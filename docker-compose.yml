version: '3.8'

networks:
  ai-agents-network:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    networks:
      - ai-agents-network
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:${OPENHANDS_VERSION:-latest}
    container_name: openhands-agent
    networks:
      - ai-agents-network
    ports:
      - "${OPENHANDS_PORT:-3000}:3000"
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - SANDBOX_USER_ID=${UID:-1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.toml:/opt/openhands/config/config.toml
      - ./openhands_workspace:/opt/openhands/workspace
    depends_on:
      - ollama
    restart: unless-stopped