services:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:0.49
    container_name: openhands-agent
    networks:
      - ai-agents-network
    ports:
      - "${OPENHANDS_PORT:-3000}:3000"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.all-hands.dev/all-hands-ai/runtime:0.49-nikolaik
      - SANDBOX_USER_ID=${MY_UID:-1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.toml:/opt/openhands/config/config.toml
      - ./openhands_workspace:/opt/openhands/workspace
    depends_on:
      - ollama
    restart: unless-stopped