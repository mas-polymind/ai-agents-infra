services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "172.17.0.1:11434:11434"
    environment:
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped

  openhands-web:
    image: ghcr.io/openhands/openhands:latest
    container_name: openhands-web
    privileged: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - LLM_MODEL=ollama/deepseek-r1:7b
      - LLM_BASE_URL=http://172.17.0.1:11434
      - LLM_API_KEY=dummy
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SANDBOX_NETWORK=bridge
      # CRITICAL FIXES FOR SANDBOX ERROR
      - OH_WEB_URL=http://localhost:3000
      - SANDBOX_CONTAINER_URL_PATTERN=http://localhost:{port}
      - AGENT_SERVER_USE_HOST_NETWORK=false
      - SANDBOX_LOCAL_HOST=127.0.0.1
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  ollama_data: