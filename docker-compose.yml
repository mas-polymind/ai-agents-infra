networks:
  ai-agents-network:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - ai-agents-network
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434" # Безопасность: доступ только локально на VPS (или через SSH-туннель)
    environment:
      - OLLAMA_NUM_THREADS=8     # Ограничиваем Ollama до 8 ядер из твоих 12
      - OLLAMA_NUM_PARALLEL=1    # Запрещаем параллельные тяжелые запросы на CPU
    deploy:
      resources:
        limits:
          memory: 24gb           # Жесткий лимит памяти для Ollama
    restart: unless-stopped

  openhands-web:
    image: ghcr.io/openhands/openhands:latest
    container_name: openhands-web
    networks:
      - ai-agents-network
    ports:
      - "127.0.0.1:3000:3000"    # Веб-интерфейс
      - "127.0.0.1:12000:12000"  # Специальный сетевой порт для подключения VS Code (ACP)
    environment:
      - LLM_MODEL=ollama/deepseek-r1:7b
      - LLM_BASE_URL=http://ollama:11434
      - LLM_API_KEY=dummy
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    # Заставляем контейнер при старте одновременно поднять и веб-панель, и сетевой ACP мост
    command: sh -c "uv run openhands serve --port 3000 & uv run openhands acp --host 0.0.0.0 --port 12000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: # Оставляем для весов моделей, это удобно
